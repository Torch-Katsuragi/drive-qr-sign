<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}署名{% endblock %} | drive-qr-sign</title>
<style>
  /*
    スマホ（QR から来た人）と PC（Drive のリンクから開いた人）の両方が主用途。
    1カラムを細く伸ばすのではなく、幅があるときは「説明」と「押す場所」を左右に分ける。
  */
  :root {
    color-scheme: light dark;
    --bg: #f4f4f6;
    --card: #ffffff;
    --ink: #1b1b1f;
    --muted: #66666e;
    --line: #e2e2e7;
    --seal: #c7112c;
    --accent: #1a4fd6;
    /* 取り消しボタン。押すのとは別の行為なので朱色から色相をずらす。
       ただし塗りつぶさない——主役は署名ボタンで、取り消しはその後始末 */
    --quiet-ink: #3f5a86;
    --quiet-line: #b5c4dc;
    --quiet-bg: #f1f5fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --card: #1f1f24;
      --ink: #ececf0;
      --muted: #a0a0aa;
      --line: #33333c;
      --accent: #7aa2ff;
      /* ⚠暗い側は --muted と --line が背景に沈んで、ボタンが見えなくなる */
      --quiet-ink: #9db6da;
      --quiet-line: #44526b;
      --quiet-bg: #242b38;
    }
  }

  * { box-sizing: border-box; }
  html { overflow-x: hidden; }
  body {
    margin: 0;
    min-height: 100dvh;
    padding: clamp(0rem, 4vw, 3rem) clamp(0rem, 3vw, 2rem);
    display: grid;
    align-content: center;
    justify-items: center;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.7;
    overflow-wrap: anywhere;
  }

  .card {
    width: 100%;
    /* rem だけで上限を切ると、文字を大きくしている端末で画面幅を超える */
    max-width: min(48rem, 100%);
    background: var(--card);
    padding: clamp(1.25rem, 4vw, 2.75rem);
    border: 1px solid var(--line);
    border-radius: clamp(0px, 2vw, 1rem);
  }

  h1 { font-size: clamp(1.15rem, 1rem + 1vw, 1.5rem); margin: 0 0 .25rem; }
  h2 { font-size: 1rem; margin: 2rem 0 .5rem; }
  p { margin: .6rem 0; }
  a { color: var(--accent); }

  /* 見出しと、いま誰として押すかを1行に並べる */
  .head { display: flex; gap: 1rem; align-items: flex-start; justify-content: space-between; }
  .head > div { min-width: 0; flex: 1; }

  /* ⚠details は flex アイテムにすると、中身（顔だけ）ではなく親いっぱいに広がる。
     幅を明示しないと見出しが1文字ずつ折り返されるところまで潰れる（実測） */
  .account { position: relative; flex: 0 0 auto; width: 2.75rem; }
  .account summary { list-style: none; cursor: pointer; }
  .account summary::-webkit-details-marker { display: none; }
  .account summary img {
    display: block; width: 2.75rem; height: 2.75rem;
    object-fit: cover; border-radius: 50%; border: 1px solid var(--line);
    background: var(--bg);
  }
  .account .menu {
    position: absolute; right: 0; top: calc(100% + .5rem); z-index: 1;
    width: max(14rem, 60vw); max-width: 20rem;
    display: grid; gap: .5rem; text-align: left;
    padding: .9rem 1rem;
    background: var(--card); border: 1px solid var(--line); border-radius: .6rem;
    box-shadow: 0 .5rem 1.5rem rgb(0 0 0 / .18);
  }
  .account .menu .who { margin: 0; }
  .account .menu a { font-size: .9rem; }

  .doc { font-size: .8rem; color: var(--muted); margin: 0; }
  .head { padding-bottom: 1.25rem; border-bottom: 1px solid var(--line); }
  .who { font-size: .9rem; color: var(--muted); margin-top: 1.25rem; }
  .role { font-size: clamp(1.5rem, 1.2rem + 2vw, 2.25rem); font-weight: 600; margin: 0 0 .5rem; }
  .note { font-size: .85rem; color: var(--muted); }

  /* 幅があるときだけ2カラム。押す場所を右に固めて、視線の行き先を1つにする */
  .cols { display: grid; gap: clamp(1.25rem, 3vw, 2.5rem); align-items: start; }
  @media (min-width: 34rem) {
    .cols { grid-template-columns: minmax(0, 1fr) 15rem; }
    .action { position: sticky; top: 1rem; }
  }

  .action { display: grid; gap: .75rem; justify-items: center; text-align: center; }
  .action .note { margin: 0; }

  .seal {
    width: min(11rem, 60vw); height: auto; aspect-ratio: 1;
    object-fit: contain;
    padding: .5rem; border: 1px dashed var(--line); border-radius: .75rem;
  }

  button {
    width: 100%; padding: 1rem 1.25rem;
    font: inherit; font-weight: 600;
    color: #fff; background: var(--seal);
    border: 0; border-radius: .6rem; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button.quiet {
    background: var(--quiet-bg); color: var(--quiet-ink);
    border: 1px solid var(--quiet-line); font-weight: 400;
  }
  /* 押せない理由は文章で添える。ボタンを消すと「取り消せる場所がある」ことごと見えなくなる */
  button[disabled] { opacity: .45; cursor: not-allowed; }
  button[disabled]:hover { filter: none; }

  input[type=file] { width: 100%; font: inherit; font-size: .9rem; margin-top: .5rem; }
  details { width: 100%; text-align: left; }
  summary { font-size: .85rem; color: var(--muted); cursor: pointer; }

  /* 書類の中身。押す前に読めることが紙の代わりの最低条件 */
  .document { margin-top: 2.5rem; border-top: 1px solid var(--line); }
  #document { margin-top: 1rem; }
  .page {
    position: relative; display: block; width: 100%; margin: 1rem 0;
    border: 1px solid var(--line); border-radius: .25rem; overflow: hidden;
    background: #fff;  /* 描き終わるまでの間も紙に見えるように */
  }
  .page canvas { display: block; }

  /* pdf.js が文字を透明で重ねる層。選択とコピーができるのはこれのおかげ */
  .textLayer {
    position: absolute; inset: 0; overflow: hidden;
    line-height: 1; text-size-adjust: none; forced-color-adjust: none;
    transform-origin: 0 0; opacity: 1;
  }
  .textLayer span, .textLayer br {
    position: absolute; white-space: pre; cursor: text;
    color: transparent; transform-origin: 0 0;
  }
  .textLayer ::selection { background: rgba(0, 100, 255, .3); }
  form { width: 100%; display: grid; gap: .75rem; }

</style>
</head>
<body>
<main class="card">
{% block content %}{% endblock %}
</main>
</body>
</html>
