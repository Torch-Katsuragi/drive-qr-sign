{% extends "base.html" %}
{% block title %}紙にかざす{% endblock %}
{% block content %}
<h1>紙にかざす</h1>
<p class="doc">{{ file_id }}</p>

<div id="ar"
     data-layout="/s/{{ file_id }}/layout.json?m={{ mac }}"
     data-pdf="/s/{{ file_id }}/document.pdf?m={{ mac }}"
     data-worker="/static/pdfjs/pdf.worker.min.mjs">
  <div class="stage">
    <video id="camera" playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <p class="note" id="ar-status">準備しています…</p>
</div>

{% if silent %}
  <h2>紙に出ない確認</h2>
  <ul class="cards">
    {% for entry in silent %}
      <li>{{ entry.signer }}</li>
    {% endfor %}
  </ul>
  <p class="note">押印枠を持たない人の記録です。紙面には出ないので、ここに並べています。</p>
{% endif %}

<p class="note"><a href="/s/{{ file_id }}?m={{ mac }}">署名の画面に戻る</a></p>
<script src="/static/jsQR.js"></script>
<script type="module" src="/static/ar.js"></script>
{% endblock %}
